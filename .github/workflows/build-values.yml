name: Build values

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - "data/companies.json"
      - "scripts/build-values.ts"
      - "src/format.ts"
      - "src/game.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:values
      - name: Commit fresh values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/values.json data/build-report.md
          git diff --cached --quiet || git commit -m "Update market values [skip ci]"
          git push
